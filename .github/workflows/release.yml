# Release on a push to main that bumps <Version> in yt-pip.csproj (when v<Version> is not tagged yet): the single
# self-contained exe (about 50 MB) to Google Drive as Apps/yt-pip/yt-pip-<Version>.exe, then the GitHub release v<Version>
# with that version's CHANGELOG entry. Bump the version and add the CHANGELOG entry in one commit, then push.
# Drive goes first so that a failed run can just be run again (Actions → Release → Run workflow): until the tag exists it redoes it all.
# Secret RCLONE_CONFIG_GDRIVE_TOKEN: the token line of the local rclone remote "gdrive" (drive.file, rclone's own client id:
# it only sees the files that client made, so the token has to be that one).
name: Release
on:
  push:
    branches: [main]
    paths: [yt-pip.csproj]
  workflow_dispatch:
concurrency: release
permissions:
  contents: write
jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          $v = ([xml](Get-Content yt-pip.csproj -Raw)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "v=$v" >> $env:GITHUB_OUTPUT
          if (git ls-remote --tags origin "refs/tags/v$v") { "v$v is out already" } else { 'new=1' >> $env:GITHUB_OUTPUT }
      - if: steps.v.outputs.new
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - if: steps.v.outputs.new
        run: |
          $v = '${{ steps.v.outputs.v }}'
          $notes = [regex]::Match((Get-Content CHANGELOG.md -Raw), "(?s)## $([regex]::Escape($v)) [^\n]*\n(.*?)(\n## |$)").Groups[1].Value.Trim()
          if (!$notes) { throw "No CHANGELOG entry for $v." }
          [IO.File]::WriteAllText("$env:RUNNER_TEMP\notes.md", $notes)
          dotnet publish -c Release -r win-x64 -p:SelfContained=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true -p:DebugType=none -p:GenerateDocumentationFile=false -o out -nologo
          if ($LASTEXITCODE) { throw 'Publish failed.' }
          $p = Start-Process out\yt-pip.exe -ArgumentList '--selftest' -Wait -PassThru
          if ($p.ExitCode) { Get-Content "$env:TEMP\yt-pip-selftest.log" -ErrorAction SilentlyContinue; throw 'Selftest failed.' }
      - if: steps.v.outputs.new
        env:
          RCLONE_CONFIG_GDRIVE_TYPE: drive
          RCLONE_CONFIG_GDRIVE_SCOPE: drive.file
          RCLONE_CONFIG_GDRIVE_TOKEN: ${{ secrets.RCLONE_CONFIG_GDRIVE_TOKEN }}
        run: |
          $r = 'rclone-v1.75.1-windows-amd64'
          Invoke-WebRequest "https://downloads.rclone.org/v1.75.1/$r.zip" -OutFile "$env:RUNNER_TEMP\rclone.zip"
          Expand-Archive "$env:RUNNER_TEMP\rclone.zip" $env:RUNNER_TEMP
          $env:Path = "$env:RUNNER_TEMP\$r;$env:Path"
          # Over the one exe already there, then renamed to this version: the same file, so its link and shortcuts stay.
          $dir = 'gdrive:Apps/yt-pip'
          $name = 'yt-pip-${{ steps.v.outputs.v }}.exe'
          $old = rclone lsf $dir --include 'yt-pip*.exe' | Select-Object -First 1
          if ($LASTEXITCODE) { throw 'Drive listing failed (is the token secret still good?).' }
          if (!$old) { $old = $name }
          rclone copyto out\yt-pip.exe "$dir/$old"
          if ($LASTEXITCODE) { throw 'Drive upload failed.' }
          if ($old -ne $name) { rclone moveto "$dir/$old" "$dir/$name" }
          if ($LASTEXITCODE) { throw "Drive rename failed (the new exe is up as $old)." }
          "Drive: $name $(rclone link "$dir/$name")" >> $env:GITHUB_STEP_SUMMARY
      - if: steps.v.outputs.new
        run: |
          $v = '${{ steps.v.outputs.v }}'
          gh release create "v$v" --target $env:GITHUB_SHA --title "YouTube PIP $v" --notes-file "$env:RUNNER_TEMP\notes.md" out\yt-pip.exe LICENSE THIRD_PARTY_NOTICES.md
          if ($LASTEXITCODE) { throw 'Release failed.' }
